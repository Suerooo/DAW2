<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <script src="JS/calc.js" defer></script>
</head>

<body>
  <main>
    <h1>Calculadora</h1>
    <p>Introduce dos números y selecciona una operación.</p>

    <p>
      <label for="numero1">Primer número:</label>
      <input type="number" id="numero1" placeholder="Introduce un número" step="any">
    </p>

    <p>
      <label for="numero2">Segundo número:</label>
      <input type="number" id="numero2" placeholder="Introduce otro número" step="any">
    </p>

    <div>
      <button type="button" id="sumar" aria-label="Sumar">+</button>
      <button type="button" id="restar" aria-label="Restar">−</button>
      <button type="button" id="multiplicar" aria-label="Multiplicar">×</button>
      <button type="button" id="dividir" aria-label="Dividir">÷</button>
    </div>

    <h2>Resultado</h2>
    <p id="resultado" role="status">Esperando operación...</p>

    <button type="button" id="limpiar">Limpiar</button>
  </main>
</body>

</html>
