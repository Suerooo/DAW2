<VirtualHost *:80>
  ServerName techsolutions.test
  DocumentRoot /var/www/techsolutions

  <Directory /var/www/techsolutions>
    Options -Indexes
    AllowOverride None
    Require all granted
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/techsolutions-error.log
  CustomLog ${APACHE_LOG_DIR}/techsolutions-access.log combined
</VirtualHost>
