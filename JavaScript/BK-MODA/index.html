<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BK Moda - Tienda Online</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="img/logo.png" type="image/png">
</head>

<body>
  <header>
    <img src="img/logo.png" alt="">
  </header>
  <main>
    <h1>Catálogo de productos</h1>
    <section class="cart" aria-labelledby="cart-title">
      <div>
        <h2 id="cart-title">Carrito</h2>
        <p id="cart-summary" role="status"></p>
      </div>
      <button type="button" id="empty-cart" disabled>Vaciar carrito</button>
    </section>
    <section class="articles-list" id="products">
    </section>
  </main>

  <script src="JS/products.js" defer></script>
  <script src="JS/script.js" defer></script>

</body>

</html>
