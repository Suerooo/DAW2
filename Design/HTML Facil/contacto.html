<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Formulario educativo construido solo con HTML y CSS.">
  <title>Contacto | HTML Fácil</title>
  <link rel="icon" href="assets/icons/blue/logo-code.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header class="cabecera">
    <a class="logo" href="index.html"><img src="assets/images/logo-header.svg" alt="HTML Fácil" width="190"
        height="44"></a>
    <nav class="navegacion">
      <a href="index.html">Inicio</a>
      <a href="curso.html">Curso HTML</a>
      <a href="ejemplos.html">Ejemplos</a>
      <a href="etiquetas.html">Etiquetas HTML</a>
      <a href="faq.html">Preguntas frecuentes</a>
      <a class="activo" href="contacto.html">Contacto</a>
    </nav>
  </header>

  <main class="contenido">
    <nav class="ruta">
      <a href="index.html">Inicio</a>
      /
      <span>Contacto</span>
    </nav>
    <div class="encabezado-seccion">
      <h1>Contacto</h1>
    </div>
    <form class="tarjeta" action="contacto.html" method="get">
      <div class="campo">
        <label for="nombre">Nombre <span>*</span></label>
        <input id="nombre" type="text" name="nombre" placeholder="Tu nombre" required minlength="2" maxlength="80">
      </div>
      <div class="campo">
        <label for="correo">Correo electrónico <span>*</span></label>
        <input id="correo" type="email" name="correo" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="campo">
        <label for="asunto">Asunto</label>
        <select id="asunto" name="asunto">
          <option value="">Selecciona una opción</option>
          <option value="pregunta">Pregunta sobre HTML</option>
          <option value="ejemplo">Duda sobre un ejemplo</option>
          <option value="sugerencia">Sugerencia</option>
        </select>
      </div>
      <div class="campo">
        <label for="mensaje">Mensaje <span>*</span></label>
        <textarea id="mensaje" name="mensaje" rows="6" placeholder="Escribe tu mensaje aquí..." required
          minlength="10"></textarea>
      </div>
      <button class="boton" type="submit">Comprobar campos</button>
    </form>
  </main>
</body>

</html>
