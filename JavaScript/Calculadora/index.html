<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="JS/calc.js" defer></script>
</head>

<body>
  <form class="calc" action="calc">
    <input type="text" name="result" id="result" disabled>
    <input id="calculate" type="button" value="=" disabled>
    <input id="seven" type="button" value="7">
    <input id="eight" type="button" value="8">
    <input id="nine" type="button" value="9">
    <input id="add" type="button" value="+" disabled>
    <input id="substract" type="button" value="-" disabled>
    <input id="four" type="button" value="4">
    <input id="five" type="button" value="5">
    <input id="six" type="button" value="6">
    <input id="multiply" type="button" value="x" disabled>
    <input id="divide" type="button" value="/" disabled>
    <input id="one" type="button" value="1">
    <input id="two" type="button" value="2">
    <input id="three" type="button" value="3">
    <input id="dot" type="button" value="." disabled>
    <input id="raise" type="button" value="^" disabled>
    <input id="zero" type="button" value="0">
    <input id="clean" type="button" value="C">
    <input id="delete" type="button" value="<">
  </form>
</body>

</html>
